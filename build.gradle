plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Aliyun Public'
		url = 'https://maven.aliyun.com/repository/public'
	}
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

def selfChecks = [
	manualSimulationSelfCheck: 'com.pixelmc.pixellogic.core.runtime.ManualSimulationSelfCheck',
	apiWebUiSelfCheck: 'com.pixelmc.pixellogic.server.api.ApiWebUiSelfCheck',
	runtimeApiSafetySelfCheck: 'com.pixelmc.pixellogic.server.api.RuntimeApiSafetySelfCheck',
	graphStorageSelfCheck: 'com.pixelmc.pixellogic.server.storage.GraphStorageSelfCheck',
	blockCatalogSelfCheck: 'com.pixelmc.pixellogic.core.catalog.BlockCatalogSelfCheck',
	blockLibraryTaxonomySelfCheck: 'com.pixelmc.pixellogic.core.catalog.BlockLibraryTaxonomySelfCheck',
	simulationBackendSelfCheck: 'com.pixelmc.pixellogic.core.simulation.SimulationBackendSelfCheck',
	conditionOutputModeSelfCheck: 'com.pixelmc.pixellogic.core.runtime.ConditionOutputModeSelfCheck',
	simulationTestContextSelfCheck: 'com.pixelmc.pixellogic.server.api.SimulationTestContextSelfCheck',
	simulationContextExpansionSelfCheck: 'com.pixelmc.pixellogic.server.api.SimulationContextExpansionSelfCheck',
	catalogExpansionV1SelfCheck: 'com.pixelmc.pixellogic.core.catalog.CatalogExpansionV1SelfCheck',
	textComponentEditorSelfCheck: 'com.pixelmc.pixellogic.core.catalog.TextComponentEditorSelfCheck',
	catalogExpansionV2SelfCheck: 'com.pixelmc.pixellogic.core.catalog.CatalogExpansionV2SelfCheck',
	catalogExpansionV3SelfCheck: 'com.pixelmc.pixellogic.core.catalog.CatalogExpansionV3SelfCheck',
	containerControlFlowSelfCheck: 'com.pixelmc.pixellogic.core.catalog.ContainerControlFlowSelfCheck',
	controlFlowContinuationSelfCheck: 'com.pixelmc.pixellogic.core.runtime.ControlFlowContinuationSelfCheck',
	loopUntilConditionRackSelfCheck: 'com.pixelmc.pixellogic.core.runtime.LoopUntilConditionRackSelfCheck',
	entityExecutionContextSelfCheck: 'com.pixelmc.pixellogic.core.runtime.EntityExecutionContextSelfCheck',
	entityTargetReferenceSelfCheck: 'com.pixelmc.pixellogic.core.runtime.EntityTargetReferenceSelfCheck',
	entityHealthTerminationSelfCheck: 'com.pixelmc.pixellogic.core.runtime.EntityHealthTerminationSelfCheck',
	entityStatusGameModeSelfCheck: 'com.pixelmc.pixellogic.core.runtime.EntityStatusGameModeSelfCheck',
	catalogValidationCleanupSelfCheck: 'com.pixelmc.pixellogic.core.catalog.CatalogValidationCleanupSelfCheck',
]

selfChecks.each { taskName, mainClassName ->
	tasks.register(taskName, JavaExec) {
		dependsOn classes
		mainClass = mainClassName
		classpath = sourceSets.main.runtimeClasspath
	}
}

tasks.register('apiWebUiDevServer', JavaExec) {
	dependsOn classes
	mainClass = 'com.pixelmc.pixellogic.server.api.ApiWebUiDevServer'
	classpath = sourceSets.main.runtimeClasspath
}

check.dependsOn selfChecks.keySet()

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
