plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Aliyun Public'
		url = 'https://maven.aliyun.com/repository/public'
	}
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

tasks.register('manualSimulationSelfCheck', JavaExec) {
	dependsOn classes
	mainClass = 'com.pixelmc.pixellogic.core.runtime.ManualSimulationSelfCheck'
	classpath = sourceSets.main.runtimeClasspath
}

tasks.register('apiWebUiSelfCheck', JavaExec) {
	dependsOn classes
	mainClass = 'com.pixelmc.pixellogic.server.api.ApiWebUiSelfCheck'
	classpath = sourceSets.main.runtimeClasspath
}

tasks.register('graphStorageSelfCheck', JavaExec) {
	dependsOn classes
	mainClass = 'com.pixelmc.pixellogic.server.storage.GraphStorageSelfCheck'
	classpath = sourceSets.main.runtimeClasspath
}

tasks.register('blockCatalogSelfCheck', JavaExec) {
	dependsOn classes
	mainClass = 'com.pixelmc.pixellogic.core.catalog.BlockCatalogSelfCheck'
	classpath = sourceSets.main.runtimeClasspath
}

tasks.register('simulationBackendSelfCheck', JavaExec) {
	dependsOn classes
	mainClass = 'com.pixelmc.pixellogic.core.simulation.SimulationBackendSelfCheck'
	classpath = sourceSets.main.runtimeClasspath
}

tasks.register('conditionOutputModeSelfCheck', JavaExec) {
	dependsOn classes
	mainClass = 'com.pixelmc.pixellogic.core.runtime.ConditionOutputModeSelfCheck'
	classpath = sourceSets.main.runtimeClasspath
}

tasks.register('simulationTestContextSelfCheck', JavaExec) {
	dependsOn classes
	mainClass = 'com.pixelmc.pixellogic.server.api.SimulationTestContextSelfCheck'
	classpath = sourceSets.main.runtimeClasspath
}

tasks.register('simulationContextExpansionSelfCheck', JavaExec) {
	dependsOn classes
	mainClass = 'com.pixelmc.pixellogic.server.api.SimulationContextExpansionSelfCheck'
	classpath = sourceSets.main.runtimeClasspath
}

tasks.register('catalogExpansionV1SelfCheck', JavaExec) {
	dependsOn classes
	mainClass = 'com.pixelmc.pixellogic.core.catalog.CatalogExpansionV1SelfCheck'
	classpath = sourceSets.main.runtimeClasspath
}

tasks.register('textComponentEditorSelfCheck', JavaExec) {
	dependsOn classes
	mainClass = 'com.pixelmc.pixellogic.core.catalog.TextComponentEditorSelfCheck'
	classpath = sourceSets.main.runtimeClasspath
}

tasks.register('apiWebUiDevServer', JavaExec) {
	dependsOn classes
	mainClass = 'com.pixelmc.pixellogic.server.api.ApiWebUiDevServer'
	classpath = sourceSets.main.runtimeClasspath
}

check.dependsOn tasks.named('manualSimulationSelfCheck')
check.dependsOn tasks.named('apiWebUiSelfCheck')
check.dependsOn tasks.named('graphStorageSelfCheck')
check.dependsOn tasks.named('blockCatalogSelfCheck')
check.dependsOn tasks.named('simulationBackendSelfCheck')
check.dependsOn tasks.named('conditionOutputModeSelfCheck')
check.dependsOn tasks.named('simulationTestContextSelfCheck')
check.dependsOn tasks.named('simulationContextExpansionSelfCheck')
check.dependsOn tasks.named('catalogExpansionV1SelfCheck')
check.dependsOn tasks.named('textComponentEditorSelfCheck')

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
